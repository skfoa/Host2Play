name: Host2Play 续期

on:
  schedule:
    # 每 4 小时触发一次
    # UTC：中国时间
    # 00:15 → 08:15
    # 04:15 → 12:15
    # 08:15 → 16:15
    # 12:15 → 20:15
    # 16:15 → 00:15
    # 20:15 → 04:15
    - cron: '15 */4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  # ========================================
  # 第一次执行
  # ========================================
  run-first:
    name: 首次执行
    runs-on: ubuntu-latest

    outputs:
      success: ${{ steps.renew_run.outcome == 'success' && 'true' || 'false' }}

    steps:
      # ----------------
      # 拉取代码
      # ----------------
      - name: 拉取仓库
        uses: actions/checkout@v4

      # ----------------
      # Python
      # ----------------
      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ----------------
      # 系统依赖
      # ----------------
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl dnsutils wget

          wget -q -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      # ----------------
      # Python 依赖
      # ----------------
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      # ----------------
      # WARP
      # ----------------
      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      # ----------------
      # DNS
      # ----------------
      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true

          sudo rm -f /etc/resolv.conf

          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" \
            | sudo tee /etc/resolv.conf

          sleep 2

          echo "========== DNS 解析测试 =========="
          nslookup host2play.gratis 1.1.1.1 || echo "[WARN] 解析失败"

          echo "========== 公网 IP =========="
          curl -s --max-time 10 https://api.ipify.org && echo

          echo "========== Cloudflare WARP =========="
          curl -s --max-time 10 \
            https://www.cloudflare.com/cdn-cgi/trace \
            | grep -E 'ip=|warp=|loc=' || true

      # ----------------
      # 执行续订
      # ----------------
      - name: 执行续订
        id: renew_run
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python -u main.py

      # ----------------
      # 上传首次执行截图
      # ----------------
      - name: 上传截图（首次）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-first-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore


  # ========================================
  # 第一次失败后重试
  # ========================================
  run-retry:
    name: 重试执行
    runs-on: ubuntu-latest

    needs: run-first

    # 只有首次执行失败才重试
    if: always() && needs.run-first.outputs.success == 'false'

    permissions:
      actions: write
      contents: read

    steps:
      # ----------------
      # 等待 60 秒
      # ----------------
      - name: 等待 60 秒
        run: |
          echo "首次执行失败，等待 60 秒后使用新的 Runner 重试..."
          sleep 60

      # ----------------
      # 拉取代码
      # ----------------
      - name: 拉取仓库
        uses: actions/checkout@v4

      # ----------------
      # Python
      # ----------------
      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ----------------
      # 系统依赖
      # ----------------
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl dnsutils wget

          wget -q -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      # ----------------
      # Python 依赖
      # ----------------
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      # ----------------
      # WARP
      # ----------------
      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      # ----------------
      # DNS
      # ----------------
      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true

          sudo rm -f /etc/resolv.conf

          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" \
            | sudo tee /etc/resolv.conf

          sleep 2

          echo "========== DNS 解析测试 =========="
          nslookup host2play.gratis 1.1.1.1 || echo "[WARN] 解析失败"

          echo "========== 公网 IP =========="
          curl -s --max-time 10 https://api.ipify.org && echo

          echo "========== Cloudflare WARP =========="
          curl -s --max-time 10 \
            https://www.cloudflare.com/cdn-cgi/trace \
            | grep -E 'ip=|warp=|loc=' || true

      # ----------------
      # 执行续订
      # ----------------
      - name: 执行续订（重试）
        id: renew_retry
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python -u main.py

      # ----------------
      # 上传重试截图
      # ----------------
      - name: 上传截图（重试）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-retry-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore


  # ========================================
  # 清理历史 Workflow
  # ========================================
  cleanup:
    name: 清理历史运行记录
    runs-on: ubuntu-latest

    needs:
      - run-first
      - run-retry

    # 不管首次成功、首次失败还是重试失败，都执行
    if: always()

    permissions:
      actions: write
      contents: read

    steps:
      - name: 清理历史运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
